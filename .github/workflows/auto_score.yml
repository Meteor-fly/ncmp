name: Auto Score

on:
  schedule:
    # GitHub Actions 定时任务存在不可控的排队延迟（实测可达数小时）。
    # 这里提前到 07:30 UTC（= 15:30 北京时间）触发，脚本内部会等待到 19:00（北京时间）再开始评分，
    # 从而保证实际评分准点发生在 19:00。
    - cron: '30 7 * * *'  # 提前触发，实际评分时间由脚本控制为 19:00 Asia/Shanghai
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          TZ: Asia/Shanghai
          MUSIC_U: ${{ secrets.MUSIC_U }}
          CSRF: ${{ secrets.CSRF }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          WAIT_TIME_MIN: ${{ secrets.WAIT_TIME_MIN }}
          WAIT_TIME_MAX: ${{ secrets.WAIT_TIME_MAX }}
          SCORE: ${{ secrets.SCORE }}
          TASK_MODE: ${{ secrets.TASK_MODE }}
          FULL_EXTRA_TASKS: ${{ secrets.FULL_EXTRA_TASKS }}
          SYNC_YUN_CIRCLE: ${{ secrets.SYNC_YUN_CIRCLE }}
        run: python main.py
